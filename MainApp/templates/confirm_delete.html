{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body text-center">
                    <h3 class="card-title text-danger mb-3">⚠️ Confirm Deletion</h3>
                    <p class="mb-4">
                        Are you sure you want to permanently delete <strong>"{{ product.product_name }}"</strong>?
                    </p>

                    <form method="POST" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    </form>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary px-4 ms-2">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
